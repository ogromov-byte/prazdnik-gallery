<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Праздник</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1C1B19;
      --clay: #9E3F27;
      --wall: #F6F4F0;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--wall);
      color: var(--ink);
      font-family: Manrope, system-ui, sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(40px, 10vw, 72px);
      font-weight: 300;
      letter-spacing: -0.02em;
    }
    p { margin: 0; font-size: 18px; line-height: 1.5; }
    .accent { color: var(--clay); }
  </style>
</head>
<body>
  <main>
    <h1>Праздник</h1>
    <p>Сайт готовится к открытию.<br><span class="accent">Скоро здесь появятся фигурки.</span></p>
  </main>
</body>
</html>
